<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .tag { font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.3px; }
    .card-title { font-size: 19px; font-weight: 800; fill: #ededed; }
    .card-line { font-size: 13.5px; font-weight: 400; fill: #a1a1aa; }
    .card-highlight { font-size: 12.5px; font-weight: 600; fill: #7dd3fc; }
  </style>

  <!-- Card 1: Production SaaS -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="384" height="216" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <text x="26" y="38" class="font-mono tag">01 // PRODUCTION SAAS</text>
    <text x="26" y="72" class="font-sans card-title">oHub Commercial AI Platform</text>
    <text x="26" y="102" class="font-sans card-line">Multi-tenant WhatsApp SaaS uniting</text>
    <text x="26" y="122" class="font-sans card-line">hybrid AI + human inbox, Kanban CRM,</text>
    <text x="26" y="142" class="font-sans card-line">Google Calendar sync &amp; AI governance.</text>
    <rect x="26" y="168" width="332" height="28" rx="6" fill="#0c2336" fill-opacity="0.7" />
    <text x="40" y="186" class="font-mono card-highlight">React 19 · Supabase RLS · n8n · Meta API</text>
  </g>

  <!-- Card 2: Academic Research & IoHT -->
  <g transform="translate(408, 0)">
    <rect x="2" y="2" width="384" height="216" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <text x="26" y="38" class="font-mono tag">02 // SCIENTIFIC RESEARCH (UFC)</text>
    <text x="26" y="72" class="font-sans card-title">OpenIoHT Sensor Framework</text>
    <text x="26" y="102" class="font-sans card-line">Backend framework for high-frequency</text>
    <text x="26" y="122" class="font-sans card-line">biomechanical time-series ingestion,</text>
    <text x="26" y="142" class="font-sans card-line">semantic validation &amp; Kaggle curation.</text>
    <rect x="26" y="168" width="332" height="28" rx="6" fill="#0c2336" fill-opacity="0.7" />
    <text x="40" y="186" class="font-mono card-highlight">NestJS · InfluxDB · TypeScript · Docker</text>
  </g>

  <!-- Card 3: Interactive 3D & Product Engineering -->
  <g transform="translate(816, 0)">
    <rect x="2" y="2" width="382" height="216" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <text x="26" y="38" class="font-mono tag">03 // 3D WEBGL &amp; EXTENSIONS</text>
    <text x="26" y="72" class="font-sans card-title">LoteVerse 3D &amp; UseAtalho</text>
    <text x="26" y="102" class="font-sans card-line">Interactive 3D real estate visualization</text>
    <text x="26" y="122" class="font-sans card-line">with Unity WebGL, plus Chrome MV3</text>
    <text x="26" y="142" class="font-sans card-line">productivity &amp; instant Pix ecosystems.</text>
    <rect x="26" y="168" width="330" height="28" rx="6" fill="#0c2336" fill-opacity="0.7" />
    <text x="40" y="186" class="font-mono card-highlight">Next.js · Unity WebGL · Chrome MV3</text>
  </g>
</svg>
